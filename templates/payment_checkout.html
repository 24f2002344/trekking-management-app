<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <title>Secure Checkout Matrix</title>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            
            <!-- Order Summary Card -->
            <div class="card shadow-sm border-0 mb-4 p-4">
                <h5 class="fw-bold mb-3 text-dark"><i class="bi bi-cart-check me-2"></i>Reservation Summary</h5>
                <hr class="text-muted my-2">
                <div class="d-flex justify-content-between my-2">
                    <span class="text-secondary">Expedition Destination:</span>
                    <span class="fw-semibold">{{ trek.name }}</span>
                </div>
                <div class="d-flex justify-content-between my-2">
                    <span class="text-secondary">Base Fare (Per Person):</span>
                    <span class="fw-semibold">₹{{ trek.price }}</span>
                </div>
                <div class="d-flex justify-content-between my-2">
                    <span class="text-secondary">Total Group Slots:</span>
                    <span class="badge bg-dark px-2.5 py-1.5 font-monospace">{{ intent.slots }} Pax</span>
                </div>
                <hr class="text-muted my-2">
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <span class="fs-5 fw-bold text-dark">Total Amount Due:</span>
                    <!-- Automatically calculated total value rendered securely -->
                    <span class="fs-3 fw-black text-success font-monospace">₹{{ intent.total_price }}</span>
                </div>
            </div>

            <!-- Payment Instruments Gateway Panel -->
            <div class="card shadow-sm border-0 p-4">
                <h5 class="fw-bold mb-4 text-dark"><i class="bi bi-shield-lock-fill text-success me-2"></i>Secure Payment Gateway</h5>
                
                <form method="POST" action="/trek/checkout">
                    
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Select Payment Instrument</label>
                        <select name="payment_method" class="form-select" required>
                            <option value="credit_card">Credit / Debit Card</option>
                            <option value="upi">UPI / Instant NetBanking</option>
                            <option value="wallet">Digital Base Wallet</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Cardholder Name / Account Alias</label>
                        <input type="text" name="card_name" class="form-control" placeholder="e.g., Jane Doe" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Card Details / Virtual Payment Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-credit-card-2-front"></i></span>
                            <input type="text" class="form-control border-start-0 ps-1" placeholder="XXXX - XXXX - XXXX - XXXX" required>
                        </div>
                    </div>

                    <div class="row g-2 mb-4">
                        <div class="col-6">
                            <label class="form-label small fw-semibold text-muted">Expiry Window</label>
                            <input type="text" class="form-control text-center" placeholder="MM/YY" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-semibold text-muted">Security Verification Code (CVV)</label>
                            <input type="password" class="form-control text-center" placeholder="***" maxlength="3" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2.5 fw-bold">
                        <i class="bi bi-lock-fill me-2"></i>Authorize Payment of ₹{{ intent.total_price }}
                    </button>
                    
                    <a href="/admin/dashboard" class="btn btn-link w-100 text-center text-muted small mt-2 decoration-none">Abort & Return</a>
                </form>

            </div>

        </div>
    </div>
</div>

</body>
</html>
