<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Trek-Kings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            
            /* The Full-Page Background Image (Matches Registration) */
            background: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
        }

        /* The dark overlay for readability */
        .overlay {
            background-color: rgba(0, 0, 0, 0.4);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 5vh;
            padding-bottom: 5vh;
        }

        .main-title {
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7); 
            margin-bottom: 2rem;
            text-align: center;
        }

        .auth-card {
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .auth-header {
            background-color: #0d6efd;
            color: white;
            padding: 1.2rem;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 500;
        }
    </style>
</head>

<body>
    
    <div class="overlay">
        
        <h1 class="main-title display-5">WELCOME TO TREK-KINGS</h1>

        <div class="auth-card">
            <div class="auth-header">
                Login
            </div>
            
            <div class="p-4">
                
                <!-- Flash Messages Handler (With the spacing fix included!) -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show mb-4 shadow-sm" role="alert" style="font-size: 14px;">
                                <i class="bi bi-exclamation-circle-fill me-2"></i>{{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <!-- Login Form -->
                <form action="/login" method="POST">
                    
                    <div class="mb-3">
                        <label class="form-label text-muted small">Email address</label>
                        <input type="email" name="email" class="form-control" placeholder="Enter email" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fs-5">Submit</button>
                    
                    <div class="text-center mt-4">
                        <span class="text-muted small">New User? <a href="/register" class="text-decoration-none fw-bold">Register here</a></span>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- Bootstrap Core JS (Ensures your Flash Message "X" button keeps working) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
