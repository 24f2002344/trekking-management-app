<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Login</title>
</head>
<body class="bg-light d-flex flex-column align-items-center justify-content-center" style="height: 100vh;">

    <div class="text-center mb-4">
        <h1 class="fw-bold text-dark tracking-wide" style="letter-spacing: 1px;">WELCOME TO TREK-KINGS</h1>
    </div>

    <div class="card shadow-sm border-0" style="width: 400px; border-radius: 8px; overflow: hidden;">
        
        <div class="bg-primary text-white text-center py-2">
            <h2 class="mb-0 fw-normal">Login</h2>
        </div>

        <div class="card-body px-4 mt-4">
            <form action="/login" method="POST">
                
                <div class="mb-3">
                    <label class="form-label text-secondary">Email address</label>
                    <input type="email" name="email" class="form-control" placeholder="Enter email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-secondary">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>

                <div class="pt-2 mb-3">
                    <button type="submit" class="btn btn-primary w-100 shadow-sm">Submit</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
